name: Ledger root proof

run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('Ledger root {0}', github.event.client_payload.batchKey) || 'Manual fixture proof' }}

on:
  repository_dispatch:
    types: [ledger-root]
  workflow_dispatch:

concurrency:
  group: >-
    ledger-root-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rootHash || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fixture-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create non-prospective fixture proof
        run: pnpm exec tsx deploy/root-publisher/create-fixture-proof.ts > fixture-manual-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixture-manual-proof
          path: fixture-manual-proof.json
          if-no-files-found: error
          retention-days: 30

  prepare-prospective-root:
    if: >-
      github.event_name == 'repository_dispatch' &&
      vars.LEDGER_ATTESTATION_ENABLED == 'true' &&
      vars.LEDGER_ROOT_ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize dispatch payload
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node -e 'require("node:fs").writeFileSync("dispatch.json", process.env.DISPATCH_PAYLOAD)'
      - name: Wait for predecessor and prepare immutable root
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec tsx deploy/root-publisher/prepare-root.ts dispatch.json
          --allow-expired-for-archive --timeout-ms 300000
          --poll-interval-ms 5000 > ledger-root.json
      - name: Record immutable attempt identity
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          node -e 'const fs = require("node:fs");
          const root = JSON.parse(fs.readFileSync("ledger-root.json", "utf8"));
          fs.writeFileSync("attestation-attempt.json", JSON.stringify({
          version: "jev-ledger-attestation-attempt/v1", state: "started",
          runId: process.env.RUN_ID, runAttempt: process.env.RUN_ATTEMPT,
          runUrl: process.env.RUN_URL, batchKey: root.batchKey,
          rootHash: root.rootHash, attestationDeadline: root.attestationDeadline,
          recordedAt: new Date().toISOString() }, null, 2) + "\n")'
      - name: Upload root candidate and attempt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ledger-root-candidate
          path: |
            ledger-root.json
            attestation-attempt.json
          if-no-files-found: error
          retention-days: 90

  archive-prospective-root:
    needs: prepare-prospective-root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ledger-root-candidate
      - name: Append original root to durable public branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx deploy/root-publisher/archive-root.ts ledger-root.json

  attest-prospective-root:
    needs: archive-prospective-root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ledger-root-candidate
      - name: Enforce deadline immediately before external publication
        run: pnpm exec tsx deploy/root-publisher/enforce-deadline.ts ledger-root.json
      - name: Create GitHub artifact attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ledger-root.json
      - name: Enforce completion before the root deadline
        run: pnpm exec tsx deploy/root-publisher/enforce-deadline.ts ledger-root.json

  report-prospective-root-result:
    if: >-
      always() &&
      github.event_name == 'repository_dispatch' &&
      vars.LEDGER_ATTESTATION_ENABLED == 'true' &&
      vars.LEDGER_ROOT_ARCHIVE_ENABLED == 'true'
    needs:
      - prepare-prospective-root
      - archive-prospective-root
      - attest-prospective-root
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Record terminal workflow evidence
        env:
          PREPARE_RESULT: ${{ needs['prepare-prospective-root'].result }}
          ARCHIVE_RESULT: ${{ needs['archive-prospective-root'].result }}
          ATTEST_RESULT: ${{ needs['attest-prospective-root'].result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          BATCH_KEY: ${{ github.event.client_payload.batchKey }}
          ROOT_HASH: ${{ github.event.client_payload.rootHash }}
          ATTESTATION_DEADLINE: ${{ github.event.client_payload.attestationDeadline }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const results = {
            prepare: process.env.PREPARE_RESULT,
            archive: process.env.ARCHIVE_RESULT,
            attest: process.env.ATTEST_RESULT,
          };
          const outcome = results.attest === "success"
            ? "success"
            : Object.values(results).includes("cancelled")
              ? "cancelled"
              : "failure";
          const evidence = {
            version: "jev-ledger-attestation-attempt/v1",
            state: "terminal",
            outcome,
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            runUrl: process.env.RUN_URL,
            batchKey: process.env.BATCH_KEY,
            rootHash: process.env.ROOT_HASH,
            attestationDeadline: process.env.ATTESTATION_DEADLINE,
            jobs: results,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            "attestation-terminal.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Ledger root attestation: ${outcome}\n\n` +
              `- Batch: \`${evidence.batchKey}\`\n` +
              `- Root: \`${evidence.rootHash}\`\n` +
              `- Prepare: ${results.prepare}\n` +
              `- Archive: ${results.archive}\n` +
              `- Attest: ${results.attest}\n` +
              `- Deadline: ${evidence.attestationDeadline}\n`,
          );
          NODE
      - name: Upload terminal attempt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ledger-root-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: attestation-terminal.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep failed and cancelled attempts loud
        if: needs['attest-prospective-root'].result != 'success'
        env:
          PREPARE_RESULT: ${{ needs['prepare-prospective-root'].result }}
          ARCHIVE_RESULT: ${{ needs['archive-prospective-root'].result }}
          ATTEST_RESULT: ${{ needs['attest-prospective-root'].result }}
        run: |
          echo "::error::Ledger root attestation did not complete successfully (prepare=${PREPARE_RESULT}, archive=${ARCHIVE_RESULT}, attest=${ATTEST_RESULT}). Replay the exact original root; do not create a replacement root."
          exit 1
